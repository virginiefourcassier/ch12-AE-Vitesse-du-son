<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapitre 12 — essai du 11 octobre</title><style>body{margin:0;font-family:Arial,sans-serif;background:#edf3f8}header{background:#144c79;color:#fff;padding:12px 22px}iframe{width:100%;height:calc(100vh - 105px);border:0}p{margin:6px 0}</style></head><body><header><b>Chapitre 12 — version de test, non notée</b><p>Les saisies restent sur cet appareil ; vérifie les résultats avant de les utiliser en classe.</p></header><iframe id="tp" title="Parcours de physique-chimie" src="./index.html?v=essai-20261011"></iframe><script>const frame=document.getElementById('tp');frame.addEventListener('load',()=>{const d=frame.contentDocument,w=frame.contentWindow;if(!d||!w)return;const sections=d.querySelectorAll('section.page');if(sections.length!==8)return;const titles=['Enregistrements LatisPro','Notre expérience','Résultats de la classe'];[3,4,5].forEach((i,j)=>{const h=sections[i].querySelector('h2');if(h)h.textContent=titles[j]});const p=d.createElement('div');p.className='card';p.innerHTML='<h3>Mesures sur la paillasse du professeur</h3><p>Renseigne uniquement les mesures effectuées pendant le TP sur l’ordinateur du professeur, et non celles des enregistrements d’entraînement.</p><label>Numéro du binôme <input id="paillasseBin" type="number" min="1" max="60"></label><label>Distance D (m) <input id="paillasseD" type="number" min="0.001" step="any"></label><label>Retard Δt (ms) <input id="paillasseDt" type="number" min="0.001" step="any"></label><button id="savePaillasse" type="button">Conserver les mesures sur cet appareil</button><p id="paillasseStatus" aria-live="polite">Cette saisie n’est pas encore envoyée au professeur.</p>';const steps=sections[4].querySelector('.steps');if(steps)steps.before(p);else sections[4].append(p);const evaluation=sections[6];evaluation.querySelector('h2').textContent='Je m’entraîne — Mesurer la vitesse du son';const warning=evaluation.querySelector('.note.warn');if(warning){warning.textContent='Pour cet essai, mesure les retards à l’aide des réticules. Indique uniquement la valeur numérique, sans l’unité, dans le champ de réponse. La note ne sera considérée comme reçue que si un accusé du serveur s’affiche.';warning.classList.remove('warn');}const classes=d.getElementById('classe');if(classes){const previous=classes.value;classes.innerHTML='<option value="">Choisir ma classe…</option>'+Array.from({length:10},(_,i)=>'<option>2nde '+(i+1)+'</option>').join('');if(previous==='Seconde 1')classes.value='2nde 1';if(previous==='Seconde 5')classes.value='2nde 5';}const groupLabel=d.getElementById('testGroup')?.closest('label');if(groupLabel){groupLabel.childNodes.forEach(n=>{if(n.nodeType===3&&n.textContent.includes('Série d’entraînement'))n.textContent=n.textContent.replace('Série d’entraînement','Choisis ton activité');});}const fixQuestions=()=>{evaluation.querySelectorAll('.test-question').forEach(q=>{const title=q.querySelector('strong');if(title)title.textContent=title.textContent.replace(/\s+erreur\b/gi,'').replace('Exploitation d’un enregistrement LatisPro erreur','Exploitation d’un enregistrement LatisPro');q.querySelectorAll('label').forEach(l=>{if(l.textContent.includes('Réponse numérique'))l.firstChild.textContent='Réponse numérique (sans unité) ';});});};const origStart=w.startTest;if(typeof origStart==='function')w.startTest=function(){origStart();fixQuestions();};const origSend=w.submitQuiz;if(typeof origSend==='function')w.submitQuiz=function(){origSend();const status=d.getElementById('quizStatus');if(status&&status.textContent.includes('Transmission demandée')){status.textContent='Réponses envoyées pour vérification. Si aucun accusé du serveur n’apparaît sous 15 secondes, n’envoie pas de nouveau et avertis ton enseignante.';w.setTimeout(()=>{if(status.textContent.startsWith('Réponses envoyées'))status.textContent='Aucune confirmation du serveur reçue : l’enregistrement est incertain. Ne renvoie pas cette tentative.';},15000);}};const e=d.createElement('script');e.src='./outils_eleves.js?v=essai-20261011';d.body.append(e);});</script></body></html>
