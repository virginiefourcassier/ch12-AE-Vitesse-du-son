<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapitre 12 — essai du 11 octobre</title><style>body{margin:0;font-family:Arial,sans-serif;background:#edf3f8}header{background:#144c79;color:#fff;padding:12px 22px}iframe{width:100%;height:calc(100vh - 105px);border:0}p{margin:6px 0}</style></head><body><header><b>Chapitre 12 — version de test, non notée</b><p>Les saisies restent sur cet appareil ; vérifie les résultats avant de les utiliser en classe.</p></header><iframe id="tp" title="Parcours de physique-chimie" src="./index.html?v=essai-20261011"></iframe><script>const frame=document.getElementById('tp');frame.addEventListener('load',()=>{const d=frame.contentDocument,w=frame.contentWindow;if(!d||!w)return;const sections=d.querySelectorAll('section.page');if(sections.length!==8)return;const titles=['Enregistrements LatisPro','Notre expérience','Résultats de la classe'];[3,4,5].forEach((i,j)=>{const h=sections[i].querySelector('h2');if(h)h.textContent=titles[j]});const p=d.createElement('div');p.className='card';p.innerHTML='<h3>Mesures sur la paillasse du professeur</h3><p>Renseigne uniquement les mesures effectuées pendant le TP sur l’ordinateur du professeur, et non celles des enregistrements d’entraînement.</p><label>Numéro du binôme <input id="paillasseBin" type="number" min="1" max="60"></label><label>Distance D (m) <input id="paillasseD" type="number" min="0.001" step="any"></label><label>Retard Δt (ms) <input id="paillasseDt" type="number" min="0.001" step="any"></label><button id="savePaillasse" type="button">Conserver les mesures sur cet appareil</button><p id="paillasseStatus" aria-live="polite">Cette saisie n’est pas encore envoyée au professeur.</p>';const steps=sections[4].querySelector('.steps');if(steps)steps.before(p);else sections[4].append(p);const e=d.createElement('script');e.src='./outils_eleves.js?v=essai-20261011';d.body.append(e);});</script></body></html>
